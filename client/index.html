<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <div class="toolbar">
      <div class="seg" id="view" role="group" aria-label="Graph">
        <button type="button" data-view="value" title="Value graph: how far along the change is over time (Tab switches, even mid-drag)">Value</button>
        <button type="button" data-view="speed" title="Speed graph: how fast the change happens over time, where the dashed line is the average (Tab switches, even mid-drag)">Speed</button>
      </div>
      <span class="spacer"></span>
      <button type="button" id="read" title="Load the curve of the first selected pair of keys">Read keys</button>
      <button type="button" id="menu-button" class="icon" title="Settings" aria-haspopup="true">⋯</button>
    </div>

    <div class="well"><canvas id="curve" tabindex="0" aria-label="Curve editor"></canvas></div>

    <div class="numbers">
      <label title="Start handle: time (influence, 0 to 1)">x1<input id="x1" inputmode="decimal" autocomplete="off"></label>
      <label title="Start handle: value (below 0 overshoots backwards)">y1<input id="y1" inputmode="decimal" autocomplete="off"></label>
      <label title="End handle: time (0 to 1)">x2<input id="x2" inputmode="decimal" autocomplete="off"></label>
      <label title="End handle: value (above 1 overshoots)">y2<input id="y2" inputmode="decimal" autocomplete="off"></label>
    </div>

    <div class="apply-row">
      <div class="seg" id="scope" role="group" aria-label="Which side of each key">
        <button type="button" data-scope="in" title="In only: the ease into each key, at the end of each segment">In</button>
        <button type="button" data-scope="both" title="Both sides of each key">Both</button>
        <button type="button" data-scope="out" title="Out only: the ease out of each key, at the start of each segment">Out</button>
      </div>
      <button type="button" id="apply" class="primary" title="Apply the curve to the selected keys">Apply</button>
    </div>

    <section id="presets" aria-label="Presets"></section>

    <p class="status" id="status" role="status"></p>
  </main>

  <div class="menu" id="settings" hidden>
    <label class="check"><input type="checkbox" id="opt-release"> Apply changes straight away</label>
    <p class="hint">When a handle is let go, a preset is picked or a number is typed.</p>
    <label class="check"><input type="checkbox" id="opt-live"> Apply while dragging</label>
    <p class="hint">Each change while dragging is a separate undo step.</p>
    <hr>
    <a href="spikes.html" class="link">Phase 0 diagnostics</a>
  </div>

  <div class="menu" id="context" hidden>
    <button type="button" data-act="rename">Rename</button>
    <button type="button" data-act="replace">Replace with the current curve</button>
    <button type="button" data-act="delete">Delete</button>
  </div>

  <script src="lib/cep.js"></script>
  <script src="lib/host.js"></script>
  <script src="main.js"></script>
</body>
</html>
